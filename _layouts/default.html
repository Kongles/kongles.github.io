<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d1d1d">
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }} | 로보틱스 연구 노트</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  {% if page.home %}
  <script src="{{ '/land-mask.js' | relative_url }}" defer></script>
  <script src="{{ '/point-cloud.js' | relative_url }}" defer></script>
  <script src="{{ '/globe.js' | relative_url }}" defer></script>
  <script src="{{ '/journal.js' | relative_url }}" defer></script>
  {% endif %}
</head>
<body id="top">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} 홈">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
        <span>{{ site.title | escape }}</span>
      </a>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="{{ '/' | relative_url }}#journal">노트</a>
        <a href="{{ '/' | relative_url }}#topics">연구 주제</a>
        <a href="{{ '/' | relative_url }}#projects">프로젝트</a>
      </nav>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer shell">
    <span>{{ site.title | escape }}</span><a href="#top">맨 위로 <span aria-hidden="true">↑</span></a>
  </footer>
</body>
</html>
